name: flutter_app
description: AI 图像与视频生成工具 - Flutter 重构版
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  flutter_staggered_animations: ^1.1.1
  provider: ^6.1.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
